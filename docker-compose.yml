# Solo la base de datos por ahora; después se agregan backend y frontend.
# Pon este archivo en la raíz del repo (junto a las carpetas backend/ y frontend/)
# y el init.sql en database/init.sql (si lo guardas en otra carpeta, cambia la ruta del volumen).

services:
  db:
    image: postgres:16
    container_name: pinwand-db
    environment:
      POSTGRES_DB: pinwand
      POSTGRES_USER: pinwand
      POSTGRES_PASSWORD: pinwand_dev   # solo para desarrollo local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  pgdata: